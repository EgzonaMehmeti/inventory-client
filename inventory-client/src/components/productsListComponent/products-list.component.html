<div class="employee-table-container">
  <button mat-mini-fab color="primary" (click)="filterProducts()">
      <mat-icon>filter_list</mat-icon>
  </button>

  <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange()" class="mat-elevation-z8">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let product">{{product.id}}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let product">{{product.name}}</td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Price</th>
      <td mat-cell *matCellDef="let product">{{product.price}}</td>
    </ng-container>

    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Category</th>
      <td mat-cell *matCellDef="let product">{{product.category}}</td>
    </ng-container>

    <ng-container matColumnDef="quantityInStock">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Quantity In Stock</th>
      <td mat-cell *matCellDef="let product">{{product.quantityInStock}}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let product">
        <button mat-button color="primary" (click)="addEditProduct('edit', product, product.id)"><mat-icon>edit</mat-icon></button>
        <button mat-button color="warn" (click)="deleteProduct(product)"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <div class="button-add">
    <button mat-mini-fab color="primary" (click)="addEditProduct('add')">
      <mat-icon class="icon-add">add</mat-icon>
    </button>
  </div>
  <mat-paginator (page)="onPageChange()" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
</div>
